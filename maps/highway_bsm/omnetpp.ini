; omnetpp.ini
; Veins / OMNeT++ configuration for the highway BSM density experiment.
; Network: HighwayScenario (must match NED file definition)
; Three experiment configs: Baseline ECDSA, PQC Dilithium3, Kalman+TTC filter.
;
; Run all configs:
;   opp_run -c Baseline_ECDSA omnetpp.ini
;   opp_run -c PQC_Dilithium3 omnetpp.ini
;   opp_run -c With_KalmanTTC_Filter omnetpp.ini
;
; sumo-launchd.py must be running before any config is started.

; ══════════════════════════════════════════════════════════════════
; GENERAL — shared by all configs
; ══════════════════════════════════════════════════════════════════
[General]
network              = HighwayScenario
sim-time-limit       = 3600s

; Run each config 3 times with different random seeds
repeat               = 3
seed-set             = ${repetition}

; ── OUTPUT DIRECTORY ──
; Results land in results/<config>-#N/
result-dir           = results

; ── TRACI / SUMO MANAGER ──
; updateInterval MUST equal step-length (0.1 s) so TraCI stays in lock-step
*.manager.updateInterval    = 0.1s
*.manager.host              = "localhost"
*.manager.port              = 9999
*.manager.autoShutdown      = false    ; keep running — ego loops indefinitely
*.manager.launchConfig      = xmldoc("highway_bsm.launchd.xml")
*.manager.moduleType        = "org.car2x.veins.modules.mobility.traci.TraCIScenarioManager"

; ── NETWORK MODULE MAPPING ──
; Map SUMO vehicle IDs starting with "ego" to BsmValidationApp
*.**.veinsmobilitytype.vehicleType = "passenger_car"

; ── CONNECTION MANAGER (DSRC 802.11p propagation range) ──
*.connectionManager.maxInterfDist  = 500m    ; 500 m DSRC range (SAE J2945/1)
*.connectionManager.sendDirect     = false

; ── PHY 802.11p (DSRC / WAVE) ──
*.**.nic.phy80211p.maxTXPower        = 200mW   ; 23 dBm EIRP limit
*.**.nic.phy80211p.sensitivity       = -89dBm  ; receiver sensitivity
*.**.nic.phy80211p.useThermalNoise   = true
*.**.nic.phy80211p.thermalNoise      = -110dBm
*.**.nic.phy80211p.noiseFloor        = -98dBm

; ── PROPAGATION MODEL ──
; Two-ray ground reflection + Nakagami-m fading (m=3 ≈ highway LOS)
; config.xml must define the TwoRayInterference and NakagamiFading models.
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml", \
    "config/analogueModel[@type='TwoRayInterference']")

; ── MAC 802.11p ──
*.**.nic.mac1609_4.txPower        = 200mW
*.**.nic.mac1609_4.bitrate        = 6Mbps   ; CCH data rate (SAE J2945/1 min)
*.**.nic.mac1609_4.cwmin          = 15
*.**.nic.mac1609_4.cwmax          = 1023

; ── BSM BEACON PARAMETERS ──
; 10 Hz mandatory rate (SAE J2945/1); random offset up to 10 ms to
; desynchronise vehicles and avoid Braess-like synchrony
*.**.appl.beaconInterval    = 0.1s
*.**.appl.maxOffset         = 0.01s
*.**.appl.sendBeacons       = true
*.**.appl.beaconLengthBits  = 2400bit    ; 300 bytes BSM payload (SAE J2735)
*.**.appl.dataOnSch         = false

; ── EGO VEHICLE APPLICATION ──
; Only vehicles whose SUMO ID starts with "ego" use BsmValidationApp.
*.*ego*.appl.typename               = "BsmValidationApp"
*.*ego*.appl.isReceiver             = true

; Verification capacity: maximum BSM/s the ego can cryptographically verify.
; At 10 Hz × 700 neighbours = 7000 BSM/s incoming; set capacity to 2500
; to study queue overflow and drop behaviour.
*.*ego*.appl.verificationCapacity   = 2500   ; BSM/s (ECDSA baseline)
*.*ego*.appl.expiryMs               = 200    ; discard unverified BSMs after 200 ms

; Ego SUMO vehicle ID (used internally for TraCI queries)
*.*ego*.appl.egoSumoId              = "ego"

; ── RESULT RECORDING ──
**.scalar-recording          = true
**.vector-recording          = true

; Critical stats: record as both scalar (aggregate) and vector (time series)
*.*ego*.appl.bsmArrivalRate.result-recording-modes  = +vector
*.*ego*.appl.queueDepth.result-recording-modes      = +vector
*.*ego*.appl.neighbourCount.result-recording-modes  = +vector
*.*ego*.appl.verifiedPerSec.result-recording-modes  = +vector
*.*ego*.appl.expiredPerSec.result-recording-modes   = +vector
*.*ego*.appl.criticalMissRate.result-recording-modes = +vector

; Suppress high-volume per-vehicle vectors for non-ego to save disk
*.**.appl.bsmArrivalRate.result-recording-modes     = -
*.**.appl.queueDepth.result-recording-modes         = -

; ══════════════════════════════════════════════════════════════════
; CONFIG 1 — Baseline ECDSA (P-256)
; Traditional PKI: ~2 ms verify time → capacity limits at high density.
; ══════════════════════════════════════════════════════════════════
[Config Baseline_ECDSA]
description = "ECDSA P-256 baseline, 2500 BSM/s verify capacity"

*.*ego*.appl.cryptoScheme          = "ECDSA_P256"
*.*ego*.appl.verifyTimeMs          = 2.0     ; 2 ms per verification (P-256 SW)
*.*ego*.appl.verificationCapacity  = 500     ; = 1/0.002 = 500 verifications/s
*.*ego*.appl.enableKalmanFilter    = false
*.*ego*.appl.enableTTCFilter       = false
*.*ego*.appl.useProposedMethod     = false

; ══════════════════════════════════════════════════════════════════
; CONFIG 2 — PQC Dilithium3 (NIST Round 3 winner)
; Post-quantum signature: ~0.4 ms verify → higher throughput.
; ══════════════════════════════════════════════════════════════════
[Config PQC_Dilithium3]
description = "Dilithium3 PQC, 0.4 ms verify, higher throughput"

*.*ego*.appl.cryptoScheme          = "DILITHIUM3"
*.*ego*.appl.verifyTimeMs          = 0.4     ; 0.4 ms per verification (Dilithium3)
*.*ego*.appl.verificationCapacity  = 2500    ; = 1/0.0004 = 2500 verifications/s
*.*ego*.appl.enableKalmanFilter    = false
*.*ego*.appl.enableTTCFilter       = false
*.*ego*.appl.useProposedMethod     = false

; ══════════════════════════════════════════════════════════════════
; CONFIG 3 — ECDSA + Kalman trajectory filter + TTC criticality filter
; Proposed method: pre-filters low-priority BSMs before crypto queue,
; protecting against overload while maintaining critical BSM delivery.
; ══════════════════════════════════════════════════════════════════
[Config With_KalmanTTC_Filter]
description = "ECDSA + Kalman pre-filter + TTC criticality scoring"

*.*ego*.appl.cryptoScheme          = "ECDSA_P256"
*.*ego*.appl.verifyTimeMs          = 2.0
*.*ego*.appl.verificationCapacity  = 500

; ── Kalman trajectory filter ──
*.*ego*.appl.enableKalmanFilter          = true
*.*ego*.appl.kalmanProcessNoise          = 0.5
*.*ego*.appl.kalmanMeasPosVar            = 1.0
*.*ego*.appl.kalmanMeasVelVar            = 0.5
; Reject BSMs whose position innovation exceeds 15 m (anomaly detection)
*.*ego*.appl.kalmanInnovationThreshold   = 15.0
*.*ego*.appl.enableKalmanTrajectoryLog   = true
*.*ego*.appl.trajectoryLogFile           = "trajectory_log.csv"

; ── TTC criticality filter ──
*.*ego*.appl.enableTTCFilter             = true
; Vehicles with TTC < 4 s are CRITICAL and bypass queue (priority lane)
*.*ego*.appl.criticalTtcThreshold        = 4.0
; Vehicles with TTC 4-8 s are MODERATE priority
*.*ego*.appl.moderateTtcThreshold        = 8.0
; Criticality score weights
*.*ego*.appl.criticalityW1Ttc            = 0.4
*.*ego*.appl.criticalityW2Distance       = 0.2
*.*ego*.appl.criticalityW3ClosingSpeed   = 0.2
*.*ego*.appl.criticalityW4Heading        = 0.1
*.*ego*.appl.criticalityW5Lane           = 0.1
; Score thresholds
*.*ego*.appl.criticalityHighThreshold    = 0.7
*.*ego*.appl.criticalityMediumThreshold  = 0.4
; Max distance to consider a vehicle relevant
*.*ego*.appl.relevanceDistanceMax        = 200.0  ; m
; Stale BSM threshold: discard if older than this
*.*ego*.appl.staleThreshold              = 0.5    ; s

; ── Screening logs ──
*.*ego*.appl.enableTtcScreeningLog       = true
*.*ego*.appl.ttcLogFile                  = "ttc_screening.csv"
*.*ego*.appl.enableTtcKalmanCompareLog   = true
*.*ego*.appl.ttcKalmanCompareLogFile     = "ttc_kalman_compare.csv"

; ── Enable proposed method (combined Kalman + TTC pipeline) ──
*.*ego*.appl.useProposedMethod           = true

; Logging interval for metrics CSV (every 1 s simulated)
*.*ego*.appl.logInterval                 = 1.0
*.*ego*.appl.logFile                     = "bsm_metrics.csv"
