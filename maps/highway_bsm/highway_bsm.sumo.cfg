<?xml version="1.0" encoding="UTF-8"?>
<!--
  highway_bsm.sumo.cfg
  SUMO simulation configuration for the Katy Freeway / I-405 BSM scenario.
  step-length=0.1 s MUST stay at 0.1 — it controls 10 Hz BSM beacon timing in OMNeT++.
  Run standalone: sumo-gui -c highway_bsm.sumo.cfg
  Run via Veins:  sumo -c highway_bsm.sumo.cfg  (remote-port 9999)
-->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
               xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">

  <!-- ── INPUT FILES ── -->
  <input>
    <net-file    value="highway_bsm.net.xml"/>
    <route-files value="highway_bsm.rou.xml"/>
    <!-- Detectors, rerouter, variable-speed signs -->
    <additional-files value="highway_bsm.add.xml"/>
  </input>

  <!-- ── SIMULATION TIME ──
       0 to 3600 s (one hour of traffic).
       step-length=0.1 s → 36000 steps per run.
       DO NOT change step-length — BSM timing depends on it. -->
  <time>
    <begin       value="0"/>
    <end         value="3600"/>
    <step-length value="0.1"/>
  </time>

  <!-- ── PROCESSING ── -->
  <processing>
    <!-- Sub-lane model (0.8 m resolution) enables realistic lateral behaviour
         and allows motorcycles to lane-split -->
    <lateral-resolution           value="0.8"/>

    <!-- Warn on collision rather than remove vehicle; keeps traffic density high -->
    <collision.action             value="warn"/>

    <!-- Teleport a stalled vehicle after 120 s (prevents total deadlock) -->
    <time-to-teleport             value="120"/>

    <!-- Do not block junctions for more than 10 s -->
    <ignore-junction-blocker      value="10"/>

    <!-- Allow minor route errors (rerouter handles ego re-entry) -->
    <ignore-route-errors          value="true"/>

    <!-- Prevent removal of vehicles that cannot depart immediately -->
    <max-depart-delay             value="10"/>
  </processing>

  <!-- ── RANDOM SEED (reproducibility) ── -->
  <random>
    <seed value="42"/>
  </random>

  <!-- ── OUTPUT ──
       FCD at 0.1 s period → use for neighbour-count validation (700+ target).
       Disable step-log to reduce console spam on long runs. -->
  <output>
    <fcd-output              value="fcd_output.xml"/>
    <fcd-output.acceleration value="true"/>
    <fcd-output.geo          value="false"/>
    <duration-log.statistics value="true"/>
  </output>
  <!-- FCD sampling period is controlled via device.fcd.period in processing -->
  <device>
    <device.fcd.period value="0.1"/>
  </device>

  <!-- ── REPORT ── -->
  <report>
    <no-step-log value="true"/>
    <!-- Print a summary every 300 simulated seconds (useful for long runs) -->
    <verbose     value="false"/>
  </report>

  <!-- ── GUI SETTINGS (ignored when running without sumo-gui) ── -->
  <gui_only>
    <start value="true"/>
    <!-- Zoom to fit network at startup -->
    <quit-on-end value="false"/>
  </gui_only>

</configuration>
